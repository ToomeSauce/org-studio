name: worker-job

# Execution Worker job runner (#1660, W-5 of Execution Workers).
#
# Fired by the GhActionsAdapter via workflow_dispatch. Runs a worker job on
# an EPHEMERAL Actions runner (never hanktank): checkout target repo → run
# engine (or smoke stub) → push worker/<ticket> branch → open PR.
#
# SECURITY INVARIANTS:
#   - Workers NEVER merge. There is no merge step here and never will be.
#     Humans own the merge gate on every worker PR.
#   - Teardown is structural: the runner is destroyed at job end and
#     GITHUB_TOKEN (itself a GitHub App installation token — the
#     github-actions app) auto-revokes. Only the branch + PR persist, and
#     both are reversible (close PR, delete branch).
#   - No secrets in logs: engine/API keys come from repo secrets, GitHub
#     masks them in log output; the job never echoes token material.
#   - Cross-repo checkout uses a custom GitHub App installation token
#     minted in-job from ORG_WORKER_APP_* secrets (registration of that App
#     is a one-time human step; see docs/design/execution-workers.md).
#     Same-repo dogfood needs none of that — GITHUB_TOKEN suffices.

run-name: "worker-job ${{ inputs.marker }} — #${{ inputs.ticket }} on ${{ inputs.target_repo }}"

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/name of the repo to work on"
        required: true
        type: string
      ticket:
        description: "Org Studio ticket number"
        required: true
        type: string
      title:
        description: "Ticket title (for the PR)"
        required: true
        type: string
      brief:
        description: "Job brief (assembled by ContextAssembler)"
        required: true
        type: string
      engine:
        description: "Engine adapter (codex | openai-compat)"
        required: false
        type: choice
        options: [codex, openai-compat]
        default: codex
      model:
        description: "Engine model name"
        required: true
        type: string
      base_url:
        description: "OpenAI-compatible base URL (openai-compat only)"
        required: false
        type: string
      api_key_env:
        description: "Env var name for API key (openai-compat only)"
        required: false
        type: string
      verification_commands:
        description: "JSON array of verification commands"
        required: false
        type: string
        default: "[]"
      marker:
        description: "Dispatch correlation marker"
        required: true
        type: string
      job_kind:
        description: "code = branch/PR output; plan = read-only JSON artifact"
        required: false
        type: choice
        options: [code, plan]
        default: code
      smoke:
        description: "true = prove provision→branch→PR→teardown without an engine"
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: worker-job-${{ inputs.target_repo }}-${{ inputs.ticket }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve checkout token
        id: auth
        env:
          SAME_REPO: ${{ inputs.target_repo == github.repository }}
        run: |
          # Same-repo: the built-in GITHUB_TOKEN is enough (it IS an ephemeral
          # GitHub App installation token). Cross-repo: a custom-App token must
          # be minted by a preceding step (not yet wired — dogfood is same-repo).
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::cross-repo checkout requires the custom GitHub App (ORG_WORKER_APP_*) — not configured in the dogfood lane yet"
            exit 1
          fi
          echo "same_repo=true >> $GITHUB_OUTPUT" > /dev/null
          echo "ok"

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ github.token }}
          persist-credentials: ${{ inputs.job_kind != 'plan' }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "org-studio-worker"
          git config user.email "worker@toomesauce.com"

      - name: Create work branch
        if: ${{ inputs.job_kind != 'plan' }}
        id: branch
        run: |
          BRANCH="worker/${{ inputs.ticket }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run job (smoke mode)
        if: ${{ inputs.smoke == 'true' && inputs.job_kind != 'plan' }}
        run: |
          # Smoke proof: a deterministic, obviously-safe change that exercises
          # the full provision→commit→push→PR path without any engine/model.
          mkdir -p .worker-smoke
          {
            echo "# Worker smoke run"
            echo "ticket: #${{ inputs.ticket }}"
            echo "marker: ${{ inputs.marker }}"
            echo "runner: ephemeral gh-actions (run ${{ github.run_id }})"
            echo "date: $(date -u +%FT%TZ)"
          } > .worker-smoke/RUN.md
          git add .worker-smoke/RUN.md
          git commit -m "chore(worker-smoke): provisioning proof for #${{ inputs.ticket }} (${{ inputs.marker }})"

      - name: Run job (engine mode)
        if: ${{ inputs.smoke != 'true' }}
        env:
          BRIEF: ${{ inputs.brief }}
          JOB_KIND: ${{ inputs.job_kind }}
          ENGINE: ${{ inputs.engine }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base_url }}
          API_KEY_ENV: ${{ inputs.api_key_env }}
          VERIFICATION_COMMANDS_JSON: ${{ inputs.verification_commands }}
          WORKER_TIMEOUT_MS: "1200000"
          # Engine credentials come from repo secrets; GitHub masks them in
          # logs. Absent secrets fail this step cleanly.
          FOUNDRY_API_KEY: ${{ secrets.WORKER_FOUNDRY_API_KEY }}
          WORKER_OPENAI_COMPAT_API_KEY: ${{ secrets.WORKER_OPENAI_COMPAT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.WORKER_OPENAI_COMPAT_API_KEY }}
        run: |
          set -euo pipefail

          printf '%s' "$BRIEF" > /tmp/brief.txt

          PLAN_READONLY=0

          # Planner checkout is made OS-read-only. core.fileMode=false keeps
          # chmod noise out of status; permissions are restored only so the
          # result artifact can be written after the engine exits.
          if [ "$JOB_KIND" = "plan" ]; then
            PLAN_READONLY=1
            trap 'if [ "$PLAN_READONLY" = "1" ]; then chmod -R u+w . || true; fi' EXIT
            git config core.fileMode false
            chmod -R a-w .
          fi

          ENGINE_EXIT=1

          write_engine_result_failure() {
            local exit_code="$1"
            local error_message="$2"
            EXIT_CODE="$exit_code" ERROR_MESSAGE="$error_message" node - <<'NODE'
          const { writeFileSync } = require('fs');
          const exitCode = Number(process.env.EXIT_CODE || '1');
          writeFileSync(
            '/tmp/engine-result.json',
            JSON.stringify({
              ok: false,
              exitCode,
              durationMs: 0,
              commands: [],
              fileChanges: [],
              messages: [],
              errors: [process.env.ERROR_MESSAGE || 'engine failed before result was available'],
              usage: null,
              rawEventCount: 0,
            }),
            'utf8',
          );
          NODE
          }

          write_engine_result_failure 1 "engine did not complete before result was updated"

          if [ "$ENGINE" = "codex" ]; then
            if [ -z "${FOUNDRY_API_KEY:-}" ]; then
              write_engine_result_failure 78 "WORKER_FOUNDRY_API_KEY secret not configured — codex engine unavailable"
              echo "::error::WORKER_FOUNDRY_API_KEY secret not configured — codex engine unavailable"
              exit 78
            fi

            npm i -g @openai/codex@0.142.5

            mkdir -p ~/.codex
            cat > ~/.codex/config.toml <<EOF
          model = "$MODEL"
          model_provider = "foundry"
          preferred_auth_method = "apikey"

          [model_providers.foundry]
          name = "Azure Foundry (openai-responses)"
          base_url = "https://mac-mini-burner-resource.cognitiveservices.azure.com/openai/v1"
          env_key = "FOUNDRY_API_KEY"
          wire_api = "responses"
          EOF

            STARTED_MS=$(python3 - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
            )
            set +e
            # Codex's own sandbox cannot initialize on Actions runners. Code
            # jobs rely on the ephemeral runner; planner jobs additionally make
            # the checkout read-only and hard-fail if anything changes.
            codex exec --json --skip-git-repo-check --sandbox danger-full-access "$(cat /tmp/brief.txt)" | tee /tmp/engine-events.jsonl
            ENGINE_EXIT=${PIPESTATUS[0]}
            set -e
            ENDED_MS=$(python3 - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
            )

            ENGINE_EXIT="$ENGINE_EXIT" STARTED_MS="$STARTED_MS" ENDED_MS="$ENDED_MS" node --experimental-strip-types - <<'NODE'
          import { parseEngineEvents } from './src/lib/workers/engine-codex.ts';
          import { readFileSync, writeFileSync } from 'fs';

          const raw = readFileSync('/tmp/engine-events.jsonl', 'utf8');
          const parsed = parseEngineEvents(raw);
          const exitCode = Number(process.env.ENGINE_EXIT || '1');
          const started = Number(process.env.STARTED_MS || '0');
          const ended = Number(process.env.ENDED_MS || '0');
          const result = {
            ok: exitCode === 0,
            exitCode,
            durationMs: Math.max(0, ended - started),
            ...parsed,
          };
          writeFileSync('/tmp/engine-result.json', JSON.stringify(result), 'utf8');
          NODE

            if [ "$JOB_KIND" != "plan" ] && [ "$ENGINE_EXIT" -eq 0 ]; then
              set +e
              node - <<'NODE'
          const { execFileSync } = require('child_process');
          const { readFileSync, writeFileSync } = require('fs');

          let commands = [];
          const result = JSON.parse(readFileSync('/tmp/engine-result.json', 'utf8'));
          try {
            const parsed = JSON.parse(process.env.VERIFICATION_COMMANDS_JSON || '[]');
            commands = Array.isArray(parsed) ? parsed : [];
          } catch (err) {
            result.errors.push(`verification_commands JSON parse failed: ${err?.message || err}`);
            result.ok = false;
            result.exitCode = 65;
          }

          if (result.ok && Array.isArray(commands)) {
            for (const cmd of commands) {
              if (typeof cmd !== 'string' || !cmd.trim()) continue;
              try {
                execFileSync('bash', ['-lc', cmd], { stdio: ['ignore', 'pipe', 'pipe'], encoding: 'utf8' });
                result.commands.push({ command: cmd, exitCode: 0 });
              } catch (err) {
                const code = Number.isInteger(err?.status) ? err.status : 1;
                const stderr = String(err?.stderr || err?.stdout || '').slice(-500);
                result.commands.push({ command: cmd, exitCode: code });
                result.errors.push(`verification failed: ${cmd} (exit ${code}) ${stderr}`.trim());
                result.ok = false;
                result.exitCode = code;
                break;
              }
            }
          }

          writeFileSync('/tmp/engine-result.json', JSON.stringify(result), 'utf8');
          if (!result.ok) process.exit(result.exitCode || 1);
          NODE
              ENGINE_EXIT=$?
              set -e
            fi
          elif [ "$ENGINE" = "openai-compat" ]; then
            if [ "$JOB_KIND" = "plan" ]; then
              node - <<'NODE'
          const { writeFileSync } = require('fs');
          writeFileSync(
            '/tmp/engine-result.json',
            JSON.stringify({
              ok: false,
              exitCode: 64,
              durationMs: 0,
              commands: [],
              fileChanges: [],
              messages: ['OpenAI-compatible engine does not support planner jobs.'],
              errors: ['planner read-only jobs require codex engine in gh-actions mode'],
              usage: null,
              rawEventCount: 0,
            }),
            'utf8',
          );
          NODE
              ENGINE_EXIT=64
            else
              set +e
              node --experimental-strip-types - <<'NODE'
          import { writeFileSync } from 'fs';
          import { runOpenAiCompatEngine } from './src/lib/workers/engine-openai-compat.ts';

          const parseVerification = (raw) => {
            try {
              const parsed = JSON.parse(raw || '[]');
              return Array.isArray(parsed) ? parsed.filter((entry) => typeof entry === 'string') : [];
            } catch {
              return [];
            }
          };

          let result;
          try {
            result = await runOpenAiCompatEngine({
              cwd: process.cwd(),
              brief: process.env.BRIEF || '',
              model: process.env.MODEL || 'gpt-4.1-mini',
              timeoutMs: Number(process.env.WORKER_TIMEOUT_MS || '1200000'),
              baseUrl: (process.env.BASE_URL || '').trim() || undefined,
              apiKeyEnv: (process.env.API_KEY_ENV || '').trim() || undefined,
              verificationCommands: parseVerification(process.env.VERIFICATION_COMMANDS_JSON || '[]'),
            });
          } catch (error) {
            result = {
              ok: false,
              exitCode: 1,
              durationMs: 0,
              commands: [],
              fileChanges: [],
              messages: ['OpenAI-compatible engine crashed before returning a result.'],
              errors: [error?.message || String(error)],
              usage: null,
              rawEventCount: 0,
            };
          }

          writeFileSync('/tmp/engine-result.json', JSON.stringify(result), 'utf8');
          if (!result.ok) process.exit(result.exitCode || 1);
          NODE
              ENGINE_EXIT=$?
              set -e
            fi
          else
            write_engine_result_failure 64 "unsupported engine '$ENGINE'"
            echo "::error::unsupported engine '$ENGINE'"
            exit 64
          fi

          if [ "$JOB_KIND" = "plan" ]; then
            chmod -R u+w .
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::planner changed the checkout; discarding changes and failing the run"
              git reset --hard HEAD
              git clean -fd
              node - <<'NODE'
          const { readFileSync, writeFileSync } = require('fs');
          let result = {
            ok: false,
            exitCode: 86,
            durationMs: 0,
            commands: [],
            fileChanges: [],
            messages: [],
            errors: [],
            usage: null,
            rawEventCount: 0,
          };
          try {
            result = JSON.parse(readFileSync('/tmp/engine-result.json', 'utf8'));
          } catch {}
          result.ok = false;
          result.exitCode = 86;
          result.errors = Array.isArray(result.errors) ? result.errors : [];
          result.errors.push('planner changed checkout contents; reset/clean applied');
          writeFileSync('/tmp/engine-result.json', JSON.stringify(result), 'utf8');
          NODE
              ENGINE_EXIT=86
            fi
          else
            if [ "$ENGINE_EXIT" -eq 0 ]; then
              git add -A ':!/tmp' || true
              if git diff --cached --quiet; then
                node - <<'NODE'
          const { readFileSync, writeFileSync } = require('fs');
          const result = JSON.parse(readFileSync('/tmp/engine-result.json', 'utf8'));
          result.ok = false;
          result.exitCode = 85;
          result.errors = Array.isArray(result.errors) ? result.errors : [];
          result.errors.push('engine+verification succeeded but produced no changes');
          writeFileSync('/tmp/engine-result.json', JSON.stringify(result), 'utf8');
          NODE
                echo "::error::engine+verification succeeded but produced no changes"
                exit 85
              fi
              git commit -m "worker(#${{ inputs.ticket }}): engine output (${{ inputs.marker }})"
            fi
          fi

          if [ "$ENGINE_EXIT" -ne 0 ]; then
            echo "::warning::engine exited with code $ENGINE_EXIT; result artifact will carry the failure"
            exit "$ENGINE_EXIT"
          fi

      - name: Push branch
        if: ${{ inputs.job_kind != 'plan' }}
        run: git push origin "${{ steps.branch.outputs.branch }}"

      - name: Open PR (never merge)
        if: ${{ inputs.job_kind != 'plan' }}
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main...HEAD 2>/dev/null && [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "::error::engine produced no commits — nothing to open a PR for (see engine step + result artifact)"
            exit 1
          fi
          BODY="Automated worker job for Org Studio ticket #${{ inputs.ticket }} (marker \`${{ inputs.marker }}\`, run ${{ github.run_id }})."
          BODY="$BODY"$'\n\n'"**Workers never merge - this PR awaits human review.**"
          BODY="$BODY"$'\n\n'"- Lane: gh-actions ephemeral runner"
          BODY="$BODY"$'\n'"- Smoke mode: ${{ inputs.smoke }}"
          BODY="$BODY"$'\n'"- Teardown: runner destroyed + token auto-revoked at job end; only this branch/PR persist (both reversible)."
          PR_URL=$(gh pr create \
            --repo "${{ inputs.target_repo }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "worker(#${{ inputs.ticket }}): ${{ inputs.title }}" \
            --body "$BODY")
          echo "### Worker PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Write result artifact
        if: ${{ always() }}
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          engine_result = None
          engine_path = Path('/tmp/engine-result.json')
          if engine_path.exists():
            try:
              engine_result = json.loads(engine_path.read_text(encoding='utf-8'))
            except Exception:
              engine_result = {
                'ok': False,
                'exitCode': None,
                'durationMs': 0,
                'commands': [],
                'fileChanges': [],
                'messages': [],
                'errors': ['result artifact parse failure'],
                'usage': None,
                'rawEventCount': 0,
              }

          pr_url = (os.environ.get('PR_URL') or '').strip() or None
          result = {
            'pr_url': pr_url,
            'engine_result': engine_result,
            'smoke': os.environ.get('SMOKE') == 'true',
            # Backwards-compat fields for older parsers.
            'usage': (engine_result or {}).get('usage') if isinstance(engine_result, dict) else None,
            'messages': (engine_result or {}).get('messages') if isinstance(engine_result, dict) else [],
            'engine_exit': (engine_result or {}).get('exitCode') if isinstance(engine_result, dict) else None,
          }
          Path('result.json').write_text(json.dumps(result), encoding='utf-8')
          PY

      - name: Upload worker result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-result
          path: result.json
          retention-days: 7
