name: Vision sync

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - docs/vision.md
      - scripts/check-vision-sync.mjs

jobs:
  check:
    name: repository vision matches live vision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run vision-check
