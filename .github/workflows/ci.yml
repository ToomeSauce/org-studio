name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The airlock: production build must pass. Mirrors what the private deploy
  # repo (teampartial/org-studio-deploy) tries to do every 30 min. If this is
  # green, deploy is unlikely to fail at build-time.
  build:
    name: build (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_SHA: ci-${{ github.sha }}

  # Type check is gating now (#1145): test-file type drift is fixed and
  # tsc is the cheapest way to keep mocks honest as types evolve.
  typecheck:
    name: typecheck (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript --noEmit
        run: npx tsc --noEmit

  # Tests are gating as of #1145 — the suite is green and we want regressions
  # to block PRs.
  test:
    name: test (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test

  # Version-scheme guard (#1561). GATING as of 2026-05-29: the whole store now
  # conforms (proj-catpilot's malformed version was cleaned by its owner). This
  # job checks package.json is valid semver (offline, --no-store). The guard
  # LOGIC is also unit-tested in the gating `test` job (version-guard.test.ts).
  # Per-project store consistency is checked by `npm run version-check` against
  # a live store (locally / pre-commit), since CI has no store to reach.
  version-guard:
    name: version-guard (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package.json version scheme
        run: node scripts/check-version-schemes.mjs --no-store
