name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The airlock: production build must pass. Mirrors what the private deploy
  # repo (teampartial/org-studio-deploy) tries to do every 30 min. If this is
  # green, deploy is unlikely to fail at build-time.
  build:
    name: build (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_SHA: ci-${{ github.sha }}

  # Type check is gating now (#1145): test-file type drift is fixed and
  # tsc is the cheapest way to keep mocks honest as types evolve.
  typecheck:
    name: typecheck (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript --noEmit
        run: npx tsc --noEmit

  # Tests are gating as of #1145 — the suite is green and we want regressions
  # to block PRs.
  test:
    name: test (${{ matrix.os }}, gating)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test

  # Catch vulnerable production dependency trees before they ship. Dev-only
  # advisories remain visible locally without blocking a runtime release.
  security-audit:
    name: production dependency audit (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: docker build (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t org-studio:ci .

  # Version-scheme guard (#1561). NON-GATING again (2026-05-29): Ana found my
  # first gating flip was premature — the guard under-scanned (it ignored
  # section.versions[], the primary roadmap version array). Fixing coverage +
  # adding named-umbrella support (e.g. catpilot "2026-Q2-sprint", a Basil-owned
  # quarter-spanning container that is legitimately not a dated release).
  # Re-promote to gating only after the full catpilot roadmap passes for the
  # RIGHT reason. The guard LOGIC is unit-tested in the gating `test` job.
  version-guard:
    name: version-guard (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package.json version scheme
        run: node scripts/check-version-schemes.mjs --no-store
